# ============================================
# Application Configuration Template
# Copy this file to application.yml and fill in your local values
# (application.yml is git-ignored)
# ============================================

spring:
  datasource:
    # --- MySQL (production-like) ---
    url: jdbc:mysql://localhost:3306/transaction_monitoring?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "your_password"
    driver-class-name: com.mysql.cj.jdbc.Driver

    # --- H2 (local dev, uncomment to use) ---
    # url: jdbc:h2:mem:transaction_monitoring;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    # username: sa
    # password:
    # driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        # dialect: org.hibernate.dialect.MySQLDialect     # for MySQL
        dialect: org.hibernate.dialect.H2Dialect          # for H2
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.framl.monitoring: INFO
